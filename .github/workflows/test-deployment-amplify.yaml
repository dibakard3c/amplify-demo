name: Deploy SSR Next.js App to Amplify

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      branch:
        description: "Amplify branch to deploy"
        required: false
        default: "main"
      app_id:
        description: "Amplify App ID (optional override)"
        required: false
        default: ""
      message:
        description: "Deployment note (optional)"
        required: false
        default: "Manual trigger from GitHub Actions"

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      APP_ID: ${{ inputs.app_id || secrets.AMPLIFY_APP_ID }}
      BRANCH: ${{ inputs.branch || secrets.AMPLIFY_BRANCH }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Zip Source Code (for Amplify SSR build)
        run: |
          zip -r source.zip . -x '*.git*' '*.github*'

      - name: Create Amplify Deployment
        id: create
        run: |
          RESPONSE=$(aws amplify create-deployment \
            --app-id $APP_ID \
            --branch-name $BRANCH)
          echo "$RESPONSE" > resp.json
          echo "UPLOAD_URL=$(jq -r '.zipUploadUrl' resp.json)" >> $GITHUB_ENV
          echo "JOB_ID=$(jq -r '.jobId' resp.json)" >> $GITHUB_ENV

      - name: Upload Source ZIP
        run: |
          curl -T source.zip "${UPLOAD_URL}"

      - name: Start Amplify Build (SSR)
        run: |
          aws amplify start-job \
            --app-id $APP_ID \
            --branch-name $BRANCH \
            --job-id $JOB_ID \
            --job-type RELEASE \
            --job-reason "${{ inputs.message }}"

      - name: Wait for Amplify Build to Finish
        run: |
          echo "Waiting for Amplify build to complete..."
          for i in {1..40}; do
            STATUS=$(aws amplify get-job \
              --app-id $APP_ID \
              --branch-name $BRANCH \
              --job-id $JOB_ID \
              --query "job.summary.status" \
              --output text)
            echo "Build status: $STATUS"
            if [ "$STATUS" == "SUCCEED" ]; then
              echo "✅ Amplify deployment succeeded"
              exit 0
            elif [ "$STATUS" == "FAILED" ]; then
              echo "❌ Amplify deployment failed"
              exit 1
            fi
            sleep 15
          done
          echo "⚠️ Timed out waiting for Amplify build"
          exit 1
