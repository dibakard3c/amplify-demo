name: Deploy Next.js SSR App to Amplify

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AMPLIFY_APP_ID: ${{ secrets.AMPLIFY_APP_ID }}
      AMPLIFY_BRANCH: main

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build Next.js app
        run: npm run build

      # ✅ Include full standalone build for Amplify SSR
      - name: Prepare deployment ZIP
        run: |
          echo "Packaging app for Amplify..."
          mkdir -p dist
          zip -r dist/source.zip . -x "*.git*" "node_modules/*" "*.github/*"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Create Amplify deployment
        id: create
        run: |
          echo "Creating Amplify deployment..."
          RESPONSE=$(aws amplify create-deployment \
            --app-id $AMPLIFY_APP_ID \
            --branch-name $AMPLIFY_BRANCH)
          echo "$RESPONSE" > response.json
          echo "UPLOAD_URL=$(jq -r '.zipUploadUrl' response.json)" >> $GITHUB_ENV
          echo "JOB_ID=$(jq -r '.jobId' response.json)" >> $GITHUB_ENV

      - name: Upload build artifact
        run: |
          echo "Uploading build ZIP to Amplify..."
          curl -T dist/source.zip "${UPLOAD_URL}"

      - name: Start Amplify deployment
        run: |
          echo "Starting Amplify deployment job..."
          aws amplify start-deployment \
            --app-id $AMPLIFY_APP_ID \
            --branch-name $AMPLIFY_BRANCH \
            --job-id $JOB_ID

      - name: Wait for Amplify deployment to complete
        run: |
          echo "Waiting for deployment..."
          for i in {1..40}; do
            STATUS=$(aws amplify list-jobs \
              --app-id $AMPLIFY_APP_ID \
              --branch-name $AMPLIFY_BRANCH \
              --max-items 1 \
              --query "jobSummaries[0].status" \
              --output text)
            echo "Status: $STATUS"
            if [ "$STATUS" = "SUCCEED" ]; then
              echo "✅ Deployment completed successfully."
              exit 0
            elif [ "$STATUS" = "FAILED" ]; then
              echo "❌ Deployment failed."
              exit 1
            fi
            sleep 15
          done
          echo "⚠️ Timed out waiting for deployment."
          exit 1
