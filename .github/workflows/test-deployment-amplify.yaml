name: Deploy SSR Next.js App to Amplify

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      branch:
        description: "Amplify branch to deploy"
        required: false
        default: "main"
      app_id:
        description: "Amplify App ID (optional override)"
        required: false
        default: "d23o9z9yprlq3v"
      message:
        description: "Deployment note (optional)"
        required: false
        default: "Manual trigger from GitHub Actions"

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      APP_ID: ${{ inputs.app_id || secrets.AMPLIFY_APP_ID }}
      BRANCH: ${{ inputs.branch || secrets.AMPLIFY_BRANCH }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Check and stop stuck Amplify deployment (if any)
        run: |
          echo "Checking for existing Amplify deployment..."

          # get only numeric job id
          JOB_ID=$(aws amplify list-jobs \
            --app-id $APP_ID \
            --branch-name $BRANCH \
            --max-items 1 \
            --query "jobSummaries[0].jobId" \
            --output text 2>/dev/null | grep -Eo '^[0-9]+' || echo "")

          if [ -z "$JOB_ID" ]; then
            echo "No valid job found."
            exit 0
          fi

          echo "Found latest job: $JOB_ID"

          STATUS=$(aws amplify get-job \
            --app-id $APP_ID \
            --branch-name $BRANCH \
            --job-id "$JOB_ID" \
            --query "job.summary.status" \
            --output text 2>/dev/null || echo "UNKNOWN")

          echo "Job status: $STATUS"

          if [ "$STATUS" = "PENDING" ] || [ "$STATUS" = "RUNNING" ] || [ "$STATUS" = "DEPLOYING" ]; then
            echo "Stopping stuck job $JOB_ID..."
            aws amplify stop-job \
              --app-id $APP_ID \
              --branch-name $BRANCH \
              --job-id "$JOB_ID" || true
            echo "Waiting 20s before continuing..."
            sleep 20
          else
            echo "No active deployment running."
          fi

      - name: Zip Source Code (for Amplify SSR build)
        run: |
          zip -r source.zip . -x '*.git*' '*.github*' 'node_modules/*'

       - name: Create Amplify Deployment
        id: create
        run: |
          RESPONSE=$(aws amplify create-deployment \
            --app-id $APP_ID \
            --branch-name $BRANCH)
          echo "AMPLIFY RESPONSE:"
          echo "$RESPONSE"
          echo "$RESPONSE" > resp.json

          UPLOAD_URL=$(jq -r '.zipUploadUrl' resp.json)
          DEPLOYMENT_ID=$(jq -r '.deploymentId // empty' resp.json)

          # Some older manual apps return jobId instead of deploymentId.
          # For these, Amplify still expects start-deployment.
          if [ -z "$DEPLOYMENT_ID" ]; then
            DEPLOYMENT_ID=$(jq -r '.jobId // empty' resp.json)
            echo "Using jobId as deployment reference: $DEPLOYMENT_ID"
          fi

          if [ -z "$DEPLOYMENT_ID" ]; then
            echo "❌ ERROR: Amplify did not return a deployment reference"
            cat resp.json
            exit 1
          fi

          echo "UPLOAD_URL=$UPLOAD_URL" >> $GITHUB_ENV
          echo "DEPLOYMENT_ID=$DEPLOYMENT_ID" >> $GITHUB_ENV

      - name: Upload Source ZIP
        run: |
          echo "Uploading source.zip to Amplify..."
          curl -T source.zip "${UPLOAD_URL}"

      - name: Start Amplify Deployment (SSR)
        run: |
          echo "Starting Amplify deployment reference: $DEPLOYMENT_ID"
          aws amplify start-deployment \
            --app-id $APP_ID \
            --branch-name $BRANCH \
            --deployment-id $DEPLOYMENT_ID

      - name: Wait for Amplify Deployment to Finish
        run: |
          echo "Waiting for Amplify deployment to complete..."
          for i in {1..60}; do
            STATUS=$(aws amplify get-deployment \
              --app-id $APP_ID \
              --branch-name $BRANCH \
              --deployment-id $DEPLOYMENT_ID \
              --query "deployment.status" \
              --output text)
            echo "Deployment status: $STATUS"
            if [ "$STATUS" == "SUCCEED" ]; then
              echo "✅ Amplify deployment succeeded!"
              exit 0
            elif [ "$STATUS" == "FAILED" ]; then
              echo "❌ Amplify deployment failed!"
              exit 1
            fi
            sleep 15
          done
          echo "⚠️ Timed out waiting for Amplify deployment."
          exit 1
